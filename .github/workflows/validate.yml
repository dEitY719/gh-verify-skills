name: validate

# Validation is defined once, in `harness-skills`, and called from all fifteen
# split-out skill repos (dotfiles #1410 D-10). Do not re-inline the checks here:
# a copy is a fifteen-way drift risk, which is exactly what NF-2 forbids.
#
# To change what is checked, edit
# dEitY719/harness-skills/.github/workflows/skill-check.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: dEitY719/harness-skills/.github/workflows/skill-check.yml@main
    with:
      plugin-name: gh-verify
      # exception-merge-checklist/references/metrics-footer.md carries the
      # emoji glyphs of the dotfiles ai-metrics PR footer. That footer is the
      # single SSOT-approved emoji exception in the upstream repo (#317 F-2 /
      # PR #320 / #367), and the reference file must show the real glyphs or it
      # cannot specify the output. Nothing else in this repo may carry one.
      # See CLAUDE.md -> "Emojis".
      #
      # `lib/vendor/` is exempt for the same reason one level down:
      # shell-common/functions/gh_pr_review.sh *prints* that footer, so its
      # verbatim upstream copy carries the same glyphs. Editing them here would
      # fork the vendor and change what the footer renders as — the tree is
      # replaced wholesale by dotfiles' own scripts/sync-shell-common-vendor.sh
      # (that script lives upstream, not here), never edited in this repo.
      allow-emoji-paths: |
        skills/exception-merge-checklist/references/
        lib/vendor/shell-common/functions/gh_pr_review.sh
