name: bats

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core + libs (pinned, same versions as dEitY719/dotfiles tests/bats/lib)
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats-core"
          git clone --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support "$RUNNER_TEMP/bats-lib/bats-support"
          git clone --depth 1 --branch v2.2.4 https://github.com/bats-core/bats-assert "$RUNNER_TEMP/bats-lib/bats-assert"
          echo "BATS_LIB_PATH=$RUNNER_TEMP/bats-lib" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/bats-core/bin" >>"$GITHUB_PATH"
      - name: bats
        run: bats -r tests/bats
